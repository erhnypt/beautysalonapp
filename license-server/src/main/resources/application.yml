spring:
  application:
    name: beautysalonapp-license-server
  datasource:
    url: jdbc:h2:file:./data/license-db;AUTO_SERVER=TRUE;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: 9000
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.beautysalonapp.license: INFO

beautysalonapp:
  license:
    # Ed25519 private key şifreli dosyası + parolası (ortam değişkeni / vault).
    key-file: ./data/ed25519.key
    key-password: ${LICENSE_KEY_PASSWORD:}
    # Dev: dosya yoksa yeni anahtar üret. ÜRETİMDE false + anahtarı sağlayın.
    allow-generate: true
    heartbeat-endpoint: https://license.beautysalonapp.com/api/v1/heartbeat
    admin-username: ${LICENSE_ADMIN_USER:admin}
    admin-password: ${LICENSE_ADMIN_PASS:admin123}
