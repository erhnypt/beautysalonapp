name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal/PR için önceki koşuyu iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # paketleme hedefi (ADR 0002); bytecode release=17
          cache: maven
      - name: Derleme + test (ArchUnit, MockMvc, Testcontainers-siz H2)
        working-directory: server
        run: ./mvnw -B -ntp verify
      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-surefire-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  postgres-it:
    name: server — PostgreSQL entegrasyon (Testcontainers)
    runs-on: ubuntu-latest          # Docker hazır
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: '-Ppg test (Testcontainers postgres:16-alpine)'
        working-directory: server
        run: ./mvnw -B -ntp -Ppg test -Dtest=PostgresIntegrationTest,MigrationTest

  perf-budget:
    name: server — performans bütçesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: '-Pperf test'
        working-directory: server
        run: ./mvnw -B -ntp -Pperf test -Dtest=PerformanceBudgetTest

  license-server:
    name: license-server — mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - working-directory: license-server
        run: ./mvnw -B -ntp verify

  web:
    name: web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e:
    name: web — E2E (Playwright, kritik akış)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web bağımlılıkları
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Playwright + Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E (playwright.config.ts backend'i mvn spring-boot:run ile ayağa kaldırır)
        working-directory: web
        env:
          CI: 'true'
        run: npm run e2e
      - name: Playwright raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  dependency-review:
    name: Bağımlılık zafiyet incelemesi (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Repo'da "Dependency graph" açık değilse action hata verir; bu kontrol birleştirmeyi
    # engellemesin (bilgilendirici). Etkinleştirince: Settings → Code security → Dependency graph.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
