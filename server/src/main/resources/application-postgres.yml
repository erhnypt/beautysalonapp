# Çok terminalli / Pro-Enterprise kurulumlar için gömülü PostgreSQL 16 profili (§4.2).
# Kurulum sihirbazı PostgreSQL'i otomatik kurar ve bu profili etkinleştirir.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/beautysalonapp
    username: beautysalonapp
    password: ${BEAUTYSALONAPP_DB_PASSWORD:beautysalonapp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgres

  jpa:
    properties:
      hibernate:
        jdbc.time_zone: UTC
