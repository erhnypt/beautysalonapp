spring:
  application:
    name: beautysalonapp-server

  datasource:
    # Varsayılan: H2 v2 file mode — sıfır kurulum, tek .mv.db dosyası (§4.2).
    # Çok terminalli kurulumlarda 'postgres' profili kullanılır.
    url: jdbc:h2:file:${beautysalonapp.data-dir:./run-data}/data/beautysalonapp;AUTO_SERVER=TRUE;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/h2
    baseline-on-migrate: true

  servlet:
    multipart:
      # Yedek geri yükleme büyük dosya kabul eder; lisans .lic küçüktür.
      max-file-size: 100MB
      max-request-size: 105MB

  h2:
    console:
      enabled: false

server:
  port: 8734
  # Varsayılan olarak yalnızca yerel makine. LAN erişimi kurulum sihirbazından
  # açılır ve açıldığında 0.0.0.0'a bağlanır (§2.3, §8.1).
  address: 127.0.0.1
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.beautysalonapp: INFO
    org.flywaydb: INFO
  pattern:
    # PII loglara yazılmaz (§8.1) — mesaj şablonlarında maskeleme sorumluluğu kodda.
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ---------------------------------------------------------------------------
# Uygulamaya özel ayarlar (AppProperties)
# ---------------------------------------------------------------------------
beautysalonapp:
  data-dir: ./run-data
  lan-access-enabled: false
  full-offline-mode: false
  display-zone: Europe/Istanbul
  default-currency: TRY
  security:
    bootstrap-admin-username: admin
    bootstrap-admin-password: admin123
  licensing:
    # Boş public key + lisans dosyası yok => GELİŞTİRME MODU (tüm modüller açık).
    # Üretim derlemesinde gömülü public key buraya (veya koda) konur.
    public-key-base64: ""
    heartbeat-enabled: true
    heartbeat-endpoint: https://license.beautysalonapp.com/api/v1/heartbeat
    read-only-days: 30
  outbound:
    allowlist:
      - https://license.beautysalonapp.com
